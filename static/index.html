<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Work Board</title>
  <meta name="theme-color" content="#0e151c" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/static/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="/static/favicon-16.png" type="image/png" sizes="16x16" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" sizes="180x180" />
  <link rel="manifest" href="/static/site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1>Work Board</h1>
    </div>
    <button type="button" class="btn-icon" id="btn-settings" title="设置" aria-label="设置">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 2v2.5M12 19.5V22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2 12h2.5M19.5 12H22M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/>
      </svg>
    </button>
  </header>

  <main class="board">
    <p class="lead">子应用面板 · 点击图标管理服务</p>
    <div class="app-grid" id="app-grid" role="list"></div>
  </main>

  <!-- App action dropdown (anchored below tile) -->
  <div class="app-dropdown" id="app-dropdown" hidden role="menu">
    <button type="button" class="action" id="act-open" role="menuitem">打开</button>
    <button type="button" class="action" id="act-start" role="menuitem">启动</button>
    <button type="button" class="action" id="act-stop" role="menuitem">停止</button>
    <button type="button" class="action" id="act-status" role="menuitem">状态</button>
  </div>

  <!-- Status detail -->
  <div class="modal-backdrop" id="status-modal" hidden>
    <div class="modal modal-wide" role="dialog" aria-modal="true" aria-labelledby="status-title">
      <button type="button" class="modal-close" data-close="status-modal" aria-label="关闭">×</button>
      <h2 id="status-title">状态</h2>
      <pre class="status-body" id="status-body"></pre>
    </div>
  </div>

  <!-- Settings / order -->
  <div class="modal-backdrop" id="settings-modal" hidden>
    <div class="modal modal-wide" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <button type="button" class="modal-close" data-close="settings-modal" aria-label="关闭">×</button>
      <h2 id="settings-title">设置 · 应用顺序</h2>
      <p class="modal-hint">上下调整顺序，每行最多显示 5 个应用。</p>
      <ul class="order-list" id="order-list"></ul>
      <div class="modal-footer">
        <button type="button" class="action primary" id="btn-save-order">保存</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
